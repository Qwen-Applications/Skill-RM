benchmark: rmbench
data_source: ${SKILLRM_DATA_ROOT}/rmbench/rmbench.jsonl
output_dir: runs/ablations/${SKILLRM_MODEL_KEY}/tool_only/rmbench
evaluation_mode: ablation_tool_only_pairwise
ablation_mode: tool_only
model: ${SKILLRM_MODEL}
base_urls: ${SKILLRM_BASE_URLS}
seed: 0
workers: 80
resume: true
temperature: 0.0
top_p: 1.0
max_tokens: 4096
enable_thinking: false
send_thinking_field: true
save_reasoning: false
timeout: 300
retries: 2
progress_every: 100
record_trace: true
tool_choice: auto
max_agent_steps: 4
enable_python_sandbox: true
python_sandbox_timeout: 3
python_sandbox_max_code_chars: 6000
python_sandbox_max_output_chars: 4000
enable_forced_finalization: true
forced_finalization_max_tokens: 128
setting_name: tool_only

